<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esta percha está vacía · A Saia da Carolina</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/brand/maniqui.svg" type="image/svg+xml">
<meta name="theme-color" content="#F4EFE6">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,300&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{ --marfil:#F4EFE6; --tinta:#151515; --acento:#9A7BB0; --acento-texto:#6F5A7E; --apagado:rgba(21,21,21,.56); }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; background:var(--marfil); color:var(--tinta);
    font-family:"Manrope",system-ui,sans-serif; font-weight:300;
    display:grid; place-items:center; padding:2rem; text-align:center;
  }
  .caja{ max-width:30rem; display:grid; justify-items:center; gap:1rem; }
  img{ height:11rem; width:auto; opacity:.5; }
  h1{ font-family:"Newsreader",Georgia,serif; font-weight:200; font-size:clamp(2rem,7vw,3.2rem); margin:0; line-height:1.05; }
  p{ color:var(--apagado); margin:0; }
  a{
    display:inline-flex; margin-top:.6rem; padding:.9rem 1.7rem;
    background:var(--acento-texto); color:#fff; text-decoration:none;
    font-size:.76rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  }
  a:hover{ background:var(--tinta); }
</style>
</head>
<body>
<div class="caja">
  <img src="assets/img/brand/maniqui.svg" alt="" aria-hidden="true" width="120" height="362">
  <h1>Esta percha está vacía</h1>
  <p>La página que buscas no existe, o ya no. Vuelve al escaparate.</p>
  <a href="./">Ir al inicio</a>
</div>
</body>
</html>
